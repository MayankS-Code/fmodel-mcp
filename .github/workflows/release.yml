name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify version matches tag
        shell: pwsh
        run: |
          . ./scripts/Common.ps1
          $version = Get-ProjectVersion (Get-Location).Path
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match project version $version." }
      - name: Bootstrap CUE4Parse and build
        shell: pwsh
        run: ./scripts/Build-Mcp.ps1
      - name: Unit tests and MCP protocol smoke
        shell: pwsh
        run: ./scripts/Test-Mcp.ps1
      - name: Publish package and verify installer
        shell: pwsh
        run: |
          $package = ./scripts/Publish-Mcp.ps1 | Select-Object -Last 1
          ./scripts/Test-Installer.ps1 -PackagePath $package
      - name: Bundle source
        shell: pwsh
        run: ./scripts/Package-Source.ps1
      - name: Extract release notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = [Collections.Generic.List[string]]::new(); $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') { if ($inSection) { break }; $inSection = $line -eq "## $version"; continue }
            if ($inSection) { $notes.Add($line) }
          }
          if (!($notes -join '').Trim()) { throw "CHANGELOG.md has no '## $version' section." }
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object FullName
          if (!$assets) { throw 'No release assets were produced.' }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "FModel MCP $env:GITHUB_REF_NAME" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
