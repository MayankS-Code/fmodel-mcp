name: Bug report
description: Something in the server, installer or an asset workflow does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check [Troubleshooting](https://github.com/plu1337/fmodel-mcp/blob/main/docs/troubleshooting.md) first.
        **Never include AES keys, FModel profiles, private paths or game files.** Report security problems privately via [SECURITY.md](https://github.com/plu1337/fmodel-mcp/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: FModel MCP version
      description: Shown in the installer output and in the release ZIP name.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Code
        - Claude Desktop
        - VS Code
        - Cursor
        - Codex
        - Other (describe below)
        - Not client-related (installer or build)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or update
        - Server start-up or client connection
        - Opening a game (keys, mappings, profiles)
        - Browsing, search or inspection
        - Export
        - Building from source
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: input
    id: game
    attributes:
      label: Game profile and archive type
      description: The GAME_* profile, PAK or IoStore, and whether mappings or Oodle are used. The game name is optional.
      placeholder: "GAME_UE5_4, IoStore, .usmap mappings, Oodle"
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the tool names and arguments (with paths and keys removed).
      placeholder: |
        1. fmodel_open_saved_game {}
        2. fmodel_start_export {"request": {"paths": ["<asset>"], "mode": "converted"}}
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or log
      description: The tool error (code and message) or the server's stderr output, sanitized.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no AES keys, private profiles, personal paths or game files.
          required: true
